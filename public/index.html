<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FollowUp Vaseo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">●</span>
      <div>
        <h1>FollowUp Vaseo</h1>
        <p>RF-naalden · Australië</p>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="top-actions">
      <span class="save-state" id="saveState"></span>
      <button class="btn ghost" id="exportBtn" title="Exporteer data">Exporteer</button>
      <button class="btn ghost" id="importBtn" title="Importeer een JSON-back-up">Importeer</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="btn primary" id="addHospitalBtn">+ Ziekenhuis</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main class="layout">
    <aside class="sidebar">
      <div class="search">
        <input id="search" type="search" placeholder="Zoek ziekenhuis, arts of stad…" autocomplete="off">
      </div>
      <div class="filters" id="statusFilters">
        <button class="chip active" data-status="all">Alle</button>
        <button class="chip" data-status="green"><i class="dot green"></i>Verkoop</button>
        <button class="chip" data-status="orange"><i class="dot orange"></i>In progress</button>
        <button class="chip" data-status="red"><i class="dot red"></i>Geen contact</button>
      </div>
      <div class="filters" id="productFilters">
        <button class="chip active" data-product="all">Alle producten</button>
        <button class="chip" data-product="Thyroid">Thyroid</button>
        <button class="chip" data-product="Fibroid">Fibroid</button>
        <button class="chip" data-product="overdue">Actie te laat</button>
      </div>
      <ul class="list" id="list"></ul>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
      <div class="map-tools">
        <button class="btn small" id="fitBtn">Toon alle</button>
        <button class="btn small" id="ausBtn">Heel Australië</button>
      </div>
      <div class="legend">
        <span><i class="dot green"></i>Aan het verkopen</span>
        <span><i class="dot orange"></i>In progress / actie nodig</span>
        <span><i class="dot red"></i>Nog geen contact</span>
      </div>
      <div class="place-hint" id="placeHint" hidden>Klik op de kaart om de locatie te kiezen · <button class="link" id="cancelPlace">Annuleer</button></div>
    </section>

    <aside class="fiche" id="fiche" hidden></aside>
  </main>

  <dialog id="dialog"><form method="dialog" id="dialogForm"></form></dialog>
  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
